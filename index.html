<!DOCTYPE html>
<html>
<head>
  <title>AgroProRisk</title>
  <style>
    body { margin: 0; overflow: hidden; }
    .contenedor {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    iframe {
      border: 0;
      width: 100%;
      /* Usamos calc para sumar exactamente la altura de la pantalla + lo que subimos el iframe */
      height: calc(100vh + 35px); 
      margin-top: -12px; /* Ajusta este número si sigue cortando (ej. -30px) o si se ve el banner (ej. -38px) */
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <iframe src="https://script.google.com/macros/s/AKfycbyMjY5XCkttc1L-xhO3Pai5ee5CUl6dAEJ-yZ7kOVhvPlIpbc8pBMpOj-PBBz8tzRPe/exec"></iframe>
  </div>
</body>
</html>
