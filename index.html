<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroProRisk</title>
  <style>
    body { margin: 0; overflow: hidden; }
    .contenedor {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    iframe {
      border: 0;
      width: 100%;
      /* Usamos calc para sumar exactamente la altura de la pantalla + lo que subimos el iframe */
      height: calc(100vh + 35px); 
      margin-top: -12px; /* Ajusta este número si sigue cortando (ej. -30px) o si se ve el banner (ej. -38px) */
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <iframe src="https://script.google.com/macros/s/AKfycbwSzSqBC4JCuswsRbGhB_21FhuqqflYdCd-9Z5TKoN2vkFO9j83e_cqq1d5R3Hp7GNW/exec"></iframe>
  </div>
</body>
</html>
